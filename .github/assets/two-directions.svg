<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" font-family="Satoshi, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="1119" height="399" rx="16" fill="#ffffff" stroke="#dbe5e0"/>

  <!-- top row: internal spend -->
  <g>
    <rect x="40" y="46" width="230" height="60" rx="10" fill="#f4f7f5" stroke="#dbe5e0"/>
    <text x="155" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#17211c">Vendor admin APIs</text>
    <text x="155" y="90" text-anchor="middle" font-size="11" fill="#6b7280">Anthropic · OpenAI · Cursor · Copilot</text>

    <path d="M270 76 H336" stroke="#9fb3aa" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="340" y="40" width="230" height="72" rx="10" fill="#ffffff" stroke="#0e8269" stroke-width="1.5"/>
    <text x="455" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#0e8269">Internal spend</text>
    <text x="455" y="82" text-anchor="middle" font-size="11" fill="#6b7280">reconcile · allocate · budget</text>
    <text x="455" y="98" text-anchor="middle" font-size="11" fill="#6b7280">by team, project, person</text>

    <path d="M570 76 H636" stroke="#9fb3aa" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- bottom row: monetization -->
  <g>
    <rect x="40" y="294" width="230" height="60" rx="10" fill="#f4f7f5" stroke="#dbe5e0"/>
    <text x="155" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#17211c">Customer usage event</text>
    <text x="155" y="338" text-anchor="middle" font-size="11" fill="#6b7280">one call, cost stamped on it</text>

    <path d="M270 324 H336" stroke="#9fb3aa" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="340" y="288" width="230" height="72" rx="10" fill="#ffffff" stroke="#0e8269" stroke-width="1.5"/>
    <text x="455" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#0e8269">Monetization</text>
    <text x="455" y="330" text-anchor="middle" font-size="11" fill="#6b7280">meter · price · entitle</text>
    <text x="455" y="346" text-anchor="middle" font-size="11" fill="#6b7280">per customer, per feature</text>

    <path d="M570 324 H636" stroke="#9fb3aa" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- converging lines to ledger -->
  <path d="M636 76 C 690 76, 690 200, 726 200" fill="none" stroke="#9fb3aa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M636 324 C 690 324, 690 200, 726 200" fill="none" stroke="#9fb3aa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- center: one ledger -->
  <rect x="730" y="160" width="180" height="80" rx="12" fill="#0e8269"/>
  <text x="820" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">One ledger</text>
  <text x="820" y="216" text-anchor="middle" font-size="11" fill="#d7f0e8">both directions</text>

  <!-- outputs -->
  <path d="M910 180 C 950 180, 950 76, 984 76" fill="none" stroke="#9fb3aa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M910 220 C 950 220, 950 324, 984 324" fill="none" stroke="#9fb3aa" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="988" y="46" width="92" height="60" rx="10" fill="#f4f7f5" stroke="#dbe5e0"/>
  <text x="1034" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#17211c">Reconciled</text>
  <text x="1034" y="86" text-anchor="middle" font-size="10" fill="#6b7280">to the invoice</text>

  <rect x="988" y="294" width="92" height="60" rx="10" fill="#f4f7f5" stroke="#dbe5e0"/>
  <text x="1034" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#17211c">Margin</text>
  <text x="1034" y="334" text-anchor="middle" font-size="10" fill="#6b7280">per customer</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb3aa"/>
    </marker>
  </defs>
</svg>
