databaseChangeLog:
  - changeSet:
      id: "20260725-1"
      author: tanso
      comment: >
        API keys are now stored as SHA-256 digests. key_hint keeps a
        displayable fragment (prefix + last four) since the plaintext is no
        longer recoverable. Existing plaintext rows are upgraded in place by
        the application on their next successful authentication.
      changes:
        - addColumn:
            tableName: account_api_keys
            columns:
              - column:
                  name: key_hint
                  type: varchar(50)
