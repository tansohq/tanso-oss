databaseChangeLog:
  - changeSet:
      id: "20260825-6"
      author: tanso
      comment: >
        Build side, the outcome join. An outcome is a unit of shipped work —
        a merged pull request, a completed issue, or whatever a CI job posts —
        with who did it and when, so spend allocated to a team or person can
        be read as cost per outcome instead of cost per month. outcome_sources
        hold the credential and scope for each system Tanso pulls from
        (GitHub repos, Linear teams); the token is encrypted like every other
        credential. outcomes are unique per (account, source, external id) so
        a re-pull is an upsert. spend_units gain a GitHub login because pull
        request authors are logins, not emails.
      changes:
        - createTable:
            tableName: outcome_sources
            columns:
              - column: { name: outcome_source_id, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: account_id, type: UUID, constraints: { nullable: false } }
              - column: { name: source, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: label, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: token, type: TEXT, constraints: { nullable: false } }
              - column: { name: scope, type: TEXT, constraints: { nullable: false } }
              - column: { name: default_spend_unit_id, type: UUID }
              - column: { name: status, type: VARCHAR(16), defaultValue: ACTIVE, constraints: { nullable: false } }
              - column: { name: last_error, type: TEXT }
              - column: { name: last_synced_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: NOW(), constraints: { nullable: false } }
              - column: { name: deleted_at, type: TIMESTAMP WITH TIME ZONE }
        - createIndex:
            tableName: outcome_sources
            indexName: idx_outcome_sources_account
            columns:
              - column: { name: account_id }
        - createTable:
            tableName: outcomes
            columns:
              - column: { name: outcome_id, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: account_id, type: UUID, constraints: { nullable: false } }
              - column: { name: outcome_source_id, type: UUID }
              - column: { name: source, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: kind, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: external_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: title, type: VARCHAR(500) }
              - column: { name: url, type: VARCHAR(1000) }
              - column: { name: actor_email, type: VARCHAR(255) }
              - column: { name: actor_login, type: VARCHAR(255) }
              - column: { name: spend_unit_id, type: UUID }
              - column: { name: occurred_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: NOW(), constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: outcomes
            columnNames: account_id, source, external_id
            constraintName: uq_outcomes_external
        - createIndex:
            tableName: outcomes
            indexName: idx_outcomes_account_occurred
            columns:
              - column: { name: account_id }
              - column: { name: occurred_at }
        - addColumn:
            tableName: spend_units
            columns:
              - column: { name: github_login, type: VARCHAR(120) }
