databaseChangeLog:
  - changeSet:
      id: "20260806-2"
      author: tanso
      comment: >
        Customer-scoped API keys: a key row may now belong to one customer of
        the account (ck_ prefix) with an explicit scope list, so an end
        customer's agent can hold a credential pinned to its own data instead
        of the tenant-wide sk_ key. Existing rows are untouched — NULL
        customer_id + NULL scopes is a legacy tenant key with full tenant
        scope.
      changes:
        - addColumn:
            tableName: account_api_keys
            columns:
              - column:
                  name: customer_id
                  type: UUID
              - column:
                  name: scopes
                  type: VARCHAR(255)
        - addForeignKeyConstraint:
            baseTableName: account_api_keys
            baseColumnNames: customer_id
            constraintName: fk_account_api_keys_customer
            referencedTableName: customers
            referencedColumnNames: customer_id
            onDelete: CASCADE
        - createIndex:
            tableName: account_api_keys
            indexName: idx_account_api_keys_account_customer
            columns:
              - column:
                  name: account_id
              - column:
                  name: customer_id
