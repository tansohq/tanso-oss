databaseChangeLog:
  - changeSet:
      id: "20260825-2"
      author: tanso
      comment: >
        Build side, the pull. vendor_usage_buckets is what Tanso fetched from a
        vendor's admin API: one row per day-bucket per dimension the vendor
        groups by (model, workspace/project, key, actor), with the token split
        the vendor reports and, for cost-report rows, the vendor's own price in
        cents. Re-syncing a window deletes and rewrites it, so the table is
        idempotent per (connection, source, bucket). vendor_invoices and their
        lines are the bill as finance sees it, imported from CSV, so a period
        can be reconciled three ways: what the price book says the tokens cost,
        what the vendor's cost report says, what the invoice says. Cache
        read/write rates join model_pricing so cached traffic is priced like
        the vendor prices it instead of at the full input rate. Connections
        gain a status and the last error so a revoked admin key is visible
        instead of silently stale.
      changes:
        - addColumn:
            tableName: model_pricing
            columns:
              - column:
                  name: cache_read_cost_per_million
                  type: NUMERIC(18, 6)
              - column:
                  name: cache_write_cost_per_million
                  type: NUMERIC(18, 6)
        - addColumn:
            tableName: vendor_connections
            columns:
              - column:
                  name: status
                  type: VARCHAR(16)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: last_error
                  type: TEXT
        - createTable:
            tableName: vendor_usage_buckets
            columns:
              - column:
                  name: vendor_usage_bucket_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: vendor_connection_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: bucket_start
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: bucket_end
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: VARCHAR(128)
              - column:
                  name: workspace_id
                  type: VARCHAR(128)
              - column:
                  name: vendor_api_key_id
                  type: VARCHAR(128)
              - column:
                  name: actor_id
                  type: VARCHAR(255)
              - column:
                  name: service_tier
                  type: VARCHAR(32)
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: uncached_input_tokens
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: cache_read_tokens
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: cache_creation_tokens
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: output_tokens
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: requests
                  type: BIGINT
              - column:
                  name: vendor_cost_cents
                  type: NUMERIC(18, 6)
              - column:
                  name: currency
                  type: VARCHAR(8)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: vendor_usage_buckets
            indexName: idx_vendor_usage_buckets_conn_source_start
            columns:
              - column:
                  name: vendor_connection_id
              - column:
                  name: source
              - column:
                  name: bucket_start
        - createIndex:
            tableName: vendor_usage_buckets
            indexName: idx_vendor_usage_buckets_account_start
            columns:
              - column:
                  name: account_id
              - column:
                  name: bucket_start
        - createTable:
            tableName: vendor_invoices
            columns:
              - column:
                  name: vendor_invoice_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: total_cents
                  type: NUMERIC(18, 2)
                  constraints:
                    nullable: false
              - column:
                  name: imported_from
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: vendor_invoices
            indexName: idx_vendor_invoices_account_period
            columns:
              - column:
                  name: account_id
              - column:
                  name: period_start
        - createTable:
            tableName: vendor_invoice_lines
            columns:
              - column:
                  name: vendor_invoice_line_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: vendor_invoice_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: kind
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: VARCHAR(128)
              - column:
                  name: quantity
                  type: NUMERIC(18, 4)
              - column:
                  name: amount_cents
                  type: NUMERIC(18, 2)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: vendor_invoice_lines
            indexName: idx_vendor_invoice_lines_invoice
            columns:
              - column:
                  name: vendor_invoice_id
